name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - run: unzip -o "*.zip" -d proj

      - run: cd proj && gradle assembleDebug --no-daemon

      - run: cp proj/app/build/outputs/apk/debug/app-debug.apk RiskCalc.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RiskCalc-apk
          path: RiskCalc.apk
